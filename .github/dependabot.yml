# Dependabot, the portfolio's shape (COMMON-PROJECT-SPEC.md, C20).
# Trimmed to what this repository has: npm, GitHub Actions, the Dockerfile
# (docker-compose.yml builds from it and pins no image of its own).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
      semver-major-days: 30
    open-pull-requests-limit: 3
    groups:
      # Families that only work in step: a major moves the whole family.
      # Listed first, since a dependency goes to the first group it matches.
      astro:
        patterns: ['astro', '@astrojs/*']
        update-types: [major]
      vitest:
        patterns: ['vitest', '@vitest/*']
        update-types: [major]
      # Every minor and patch, production and development together:
      # one pull request a month.
      minor-and-patch:
        update-types: [minor, patch]
      security:
        applies-to: security-updates
        patterns: ['*']
    ignore:
      # Node's type definitions follow .nvmrc's major (C14).
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # TypeScript stays on 5.x (N2): `astro check` needs the compiler's
      # JavaScript API, which TypeScript 7 dropped, and @astrojs/check's peer
      # range refuses 7 (npm ci fails with ERESOLVE, PR #12). Lift it the day
      # @astrojs/check reads TypeScript 7.
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    ignore:
      # The base image follows .nvmrc's major (C14): a new Node major is
      # raised by hand, with .nvmrc, CI and @types/node in the same PR.
      - dependency-name: 'node'
        update-types: ['version-update:semver-major']
