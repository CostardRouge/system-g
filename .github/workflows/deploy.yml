name: Deploy to GitHub Pages

# Automatic deployment of the static Astro site to GitHub Pages,
# on every push to the main branch (and manually triggerable).

on:
  push:
    branches: [main]
  workflow_dispatch:

# Permissions required by the Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment run at a time
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # Named rather than ubuntu-latest, which moves to Ubuntu 26 from 2026-10-19.
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Historique complet requis par src/pages/sitemap.xml.ts, qui lit
          # la date du dernier commit de chaque page pour le <lastmod>.
          fetch-depth: 0

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v6
        with:
          # Create the Pages site automatically if it doesn't exist yet,
          # so the deploy doesn't depend on the Settings → Pages toggle.
          enablement: true

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          # The major CI and the Docker image run on (COMMON-PROJECT-SPEC, C14).
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the site
        run: npm run build
        env:
          # `configure-pages` provides the correct URL + base path
          # (custom domain via CNAME, or /<repo> for a project repo).
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          # Mesure d'audience : l'identifiant du site est dans le code
          # (src/lib/audience.ts) ; poser ici UMAMI_WEBSITE_ID le remplace,
          # et vide le coupe.

      - name: Upload the artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
